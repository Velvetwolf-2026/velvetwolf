version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.0
        - nvm use 22.22.0
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build:amplify
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
