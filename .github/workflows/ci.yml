name: Velvetwolf CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Same version as package.json engines, the Dockerfile and Amplify
        node-version-file: '.nvmrc'
        cache: 'npm'

    # npm ci installs exactly what package-lock.json pins (npm install may
    # silently resolve newer versions than production builds with)
    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Tests With Coverage
      run: npm run test:coverage

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

    - name: Verify Production Build
      run: npm run build
