name: Build and Deploy to Lightsail

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

env:
  # Frontend container runs in Mumbai (closer to velvetwolf.in's actual user
  # base) even though the backend Lambda/API Gateway stays in us-east-1 —
  # server-side API calls during SSR take the cross-region latency hit instead.
  AWS_REGION: ap-south-1
  LIGHTSAIL_SERVICE: velvetwolf-web
  CONTAINER_LABEL: web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `aws lightsail push-container-image` shells out to this plugin binary —
      # it's not bundled with the AWS CLI, so it has to be installed separately.
      - name: Install lightsailctl plugin
        run: |
          curl -sSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Build image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_RECAPTCHA_SITEKEY="${{ secrets.VITE_RECAPTCHA_SITEKEY }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            -t "velvetwolf-web:$IMAGE_TAG" \
            .

      # Lightsail keeps its own private per-service image registry — this pushes
      # into it directly (no ECR involved) and prints a reference like
      # ":velvetwolf-web.web.7" that the deployment step below needs.
      - name: Push image to Lightsail
        id: push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OUTPUT=$(aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE" \
            --label "$CONTAINER_LABEL" \
            --image "velvetwolf-web:$IMAGE_TAG")
          echo "$OUTPUT"
          REF=$(echo "$OUTPUT" | grep -oE ":${LIGHTSAIL_SERVICE}\.${CONTAINER_LABEL}\.[0-9]+" | tail -1)
          if [ -z "$REF" ]; then
            echo "Could not parse pushed image reference from lightsailctl output" >&2
            exit 1
          fi
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lightsail container service
        run: |
          aws lightsail create-container-service-deployment \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE" \
            --containers "{\"app\":{\"image\":\"${{ steps.push.outputs.image_ref }}\",\"ports\":{\"80\":\"HTTP\"}}}" \
            --public-endpoint "{\"containerName\":\"app\",\"containerPort\":80,\"healthCheck\":{\"path\":\"/healthz\",\"healthyThreshold\":2,\"unhealthyThreshold\":2,\"timeoutSeconds\":5,\"intervalSeconds\":10,\"successCodes\":\"200\"}}"
