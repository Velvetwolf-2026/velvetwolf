AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VelvetWolf backend migration stack for running auth APIs on AWS Lambda.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512

Resources:
  VelvetwolfHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://www.velvetwolf.in
          - https://velvetwolf.in
          - https://develop.d2xmob7nneg6g3.amplifyapp.com
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-CSRF-Token
        AllowMethods:
          - GET
          - POST
          - OPTIONS
          - PUT
          - PATCH
          - DELETE
        AllowCredentials: true
        MaxAge: 600

  VelvetwolfBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Events:
        # Catch-all routes to forward all requests to the Lambda handler
        CatchAllGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /{proxy+}
            Method: GET
        CatchAllPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /{proxy+}
            Method: POST
        CatchAllPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /{proxy+}
            Method: PUT
        CatchAllPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /{proxy+}
            Method: PATCH
        CatchAllDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /{proxy+}
            Method: DELETE
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref VelvetwolfHttpApi
            Path: /
            Method: GET
